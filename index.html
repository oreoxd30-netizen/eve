    <!-- --- BACKGROUND MUSIC PLAYER WITH CONTROLS --- -->
    <audio id="bg-music" loop preload="auto">
        <source src="piano 56mb.wav" type="audio/wav">
    </audio>

    <!-- Floating Mute Button Widget (Top Right Corner) -->
    <button id="mute-btn">Music</button>

    <script>
      const audio = document.getElementById('bg-music');
      const muteBtn = document.getElementById('mute-btn');
      let audioCtx;

      function setupAudioBoost() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaElementSource(audio);
          const gainNode = audioCtx.createGain();
          
          gainNode.gain.value = 1.5; // 1.5 = 150% volume
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      // Bypasses browser autoplay rules on the first click anywhere on the website
      document.addEventListener('click', function() {
        if (audio.paused && muteBtn.textContent === "🎵 Music: Off") {
          setupAudioBoost();
          audio.play();
          muteBtn.textContent = "🎵 Music: On";
        }
      }, { once: true });

      // Handles manual clicking of the mute toggle button
      muteBtn.addEventListener('click', function(e) {
        e.stopPropagation(); // Prevents conflict with the page-click listener
        setupAudioBoost();
        
        if (audio.paused) {
          audio.play();
          muteBtn.textContent = "On";
        } else {
          audio.pause();
          muteBtn.textContent = "Off";
        }
      });
    </script>
