     <!-- --- BACKGROUND MUSIC PLAYER WITH CONTROLS --- -->
    <audio id="bg-music" autoplay loop>

    <!-- Floating Mute Button Widget (Top Right Corner) -->
    <button id="mute-btn">🎵 Music: Off</button>

    <script>
      const audio = document.getElementById('bg-music');
      const muteBtn = document.getElementById('mute-btn');

      // Bypasses browser autoplay rules on the first click anywhere on the website
      document.addEventListener('click', function() {
        if (audio.paused && muteBtn.textContent === "🎵 Music: Off") {
          audio.play();
          muteBtn.textContent = "ON";
        }
      }, { once: true });

      // Handles manual clicking of the mute toggle button
      muteBtn.addEventListener('click', function(e) {
        e.stopPropagation(); // Prevents conflict with the page-click listener
        
        if (audio.paused) {
          audio.play();
          muteBtn.textContent = "ON";
        } else {
          audio.pause();
          muteBtn.textContent = "OFF";
        }
      });
    </script>
